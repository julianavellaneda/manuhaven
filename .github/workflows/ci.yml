name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned by the packageManager field, so CI and contributors use
          # the Bun that wrote bun.lock.
          bun-version-file: package.json

      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit

      # Includes the en/es key-parity test, which is the one that catches a
      # half-translated PR.
      - run: bun run test

      - name: Build
        # The build needs no configuration: everything deployment-specific is
        # read at request time.
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: bun run build

  database:
    name: Database migrations and authz
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: manuhaven
          POSTGRES_PASSWORD: manuhaven
          POSTGRES_DB: manuhaven
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U manuhaven -d manuhaven"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # S3-compatible server for the s3 storage driver's tests.
      rustfs:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ACCESS_KEY: manuhaven
          RUSTFS_SECRET_KEY: manuhaven-secret
        ports:
          - 9000:9000
    env:
      DATABASE_URL: postgres://manuhaven:manuhaven@localhost:5432/manuhaven
      S3_TEST_ENDPOINT: http://localhost:9000
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # A schema edit without its generated migration would ship a database
      # that doesn't match the code.
      - name: Migrations match lib/db/schema.ts
        run: |
          bun run db:generate
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            echo "::error::lib/db/schema.ts changed without a migration. Run 'bun run db:generate' and commit drizzle/."
            git status --porcelain -- drizzle
            exit 1
          fi

      - name: Migrate an empty database
        run: bun run db:migrate

      - name: Migrating again is a no-op
        run: bun run db:migrate

      - name: Authorization and storage tests against real services
        run: bun run test:integration

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build app image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha,scope=manuhaven
          cache-to: type=gha,mode=max,scope=manuhaven
      - name: Build converter image
        uses: docker/build-push-action@v7
        with:
          context: services/converter
          push: false
          cache-from: type=gha,scope=manuhaven-converter
          cache-to: type=gha,mode=max,scope=manuhaven-converter
