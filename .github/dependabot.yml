version: 2
updates:
  # The bun ecosystem updates bun.lock alongside package.json, so these PRs
  # pass CI's frozen-lockfile install without a manual `bun install`.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      ai-sdk:
        patterns: ["ai", "@ai-sdk/*"]
      tiptap:
        patterns: ["@tiptap/*"]
      # react and react-dom must move together or tests fail on a version mismatch.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      # Majors (TypeScript, ESLint, Vitest…) arrive as individual PRs instead.
      dev-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]
    ignore:
      # AI SDK 6 -> 7 is a planned migration (ROADMAP.md v0.4), not a bump.
      - dependency-name: "ai"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@ai-sdk/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: bun
    directory: /services/converter
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: docker
    directories:
      - /
      - /services/converter
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    ignore:
      # Stay on Node LTS; odd majors are never LTS. Move to 26 by hand once it is.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
